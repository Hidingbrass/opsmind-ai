name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

  java-test:
    name: Java 21 Maven test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-springboot/pom.xml

      - name: Run Maven tests
        working-directory: backend-springboot
        run: mvn --batch-mode --no-transfer-progress test

  python-test:
    name: Python 3.11 unittest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-agent-service/requirements.txt

      - name: Install Python dependencies
        working-directory: ai-agent-service
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Python unit tests
        working-directory: ai-agent-service
        run: python -m unittest discover -s tests -p "test_*.py" -v

  frontend-build:
    name: Node 22 React build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-dashboard/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-dashboard
        run: npm ci

      - name: Build frontend
        working-directory: frontend-dashboard
        run: npm run build
